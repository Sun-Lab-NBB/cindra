# Defines the build system used for the project.
[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

# Project metadata section. Provides the general ID information about the project.
[project]
name = "cindra"
version = "2.0.0rc3"
description = "Provides pipelines for processing neural imaging data and tracking Regions of Interest across multiple recordings."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ivan Kondratyev" },
    { name = "Natalie Yeung" },
]
maintainers = [
    { name = "Ivan Kondratyev", email = "ik278@cornell.edu" },
]

keywords = [
    "calcium-imaging",
    "two-photon",
    "one-photon",
    "neural-imaging",
    "roi-detection",
    "motion-correction",
    "spike-deconvolution",
    "neuroscience",
    "fluorescence",
    "cell-tracking",
]

classifiers = [
    # Development status
    "Development Status :: 5 - Production/Stable",
    # Intended audience and project topic
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    # Supported Python Versions
    "Programming Language :: Python :: 3.14",
    # Supported Operating Systems
    "Operating System :: OS Independent",
    # Typing
    "Typing :: Typed",
]

# Runtime project dependencies.
dependencies = [
    # Numerical and Scientific Computing
    "numpy>=2,<3",
    "numba>=0.64,<1",
    "scipy>=1,<2",
    "scikit-learn>=1,<2",
    "threadpoolctl>=3,<4",
    "natsort>=8,<9",

    # Image I/O
    "tifffile>=2026,<2027",
    # Supplies the codecs tifffile loads at runtime to decode compressed TIFF data, which no cindra module imports.
    # The floor matches the one tifffile itself declares for its 'codecs' extra.
    "imagecodecs>=2026.5.10,<2027",

    # Visualization
    "matplotlib>=3,<4",

    # GUI
    "pyside6>=6,<7",
    "pyqtgraph>=0.14,<1",  # 0.14 is the release whose bundled colormaps and PySide6 binding the viewers are built on

    # CLI and MCP Server
    "click>=8,<9",
    "mcp>=2,<3",

    # Host Resource Introspection
    "psutil>=7,<8",

    # Ataraxis
    "ataraxis-time>=7,<8",
    "ataraxis-base-utilities>=7,<8",
    "ataraxis-data-structures>=7.1,<8",  # 7.1 first exports 'atomic_write' and 'index_marker_files'

    # Runtime Utilities
    "pyyaml>=6,<7",

    # Platform-Specific Acceleration
    "tbb4py>=2023,<2024; sys_platform != 'darwin'",
    # Supplies the SVML runtime Numba's vectorization path loads. The path stays inert while llvmlite reports no SVML
    # support, and the pin is held so that a Numba release restoring it needs no packaging change here.
    "intel-cmplr-lib-rt>=2026,<2027; sys_platform != 'darwin'",
]

# Project repository and hosted documentation URLs.
[project.urls]
Homepage = "https://github.com/Sun-Lab-NBB/cindra"
Documentation = "https://cindra-api-docs.netlify.app/"

# CLI interfaces. The GUI launcher is a separate entry point, so headless 'cindra' runs never load Qt.
[project.scripts]
cindra = "cindra.interface.cli:cindra_cli"
cindra-gui = "cindra.interface.gui_cli:cindra_gui"

# Development dependencies (PEP 735). Not published to PyPI.
[dependency-groups]
dev = [
    # Tox
    "tox>=4,<5",
    "uv>=0,<1",
    "tox-uv>=1,<2",

    # Development Automation
    "ataraxis-automation>=9,<10",

    # Types
    "scipy-stubs>=1,<2",
    "types-psutil>=7,<8",
    "types-pyyaml>=6,<7",
]

# Specifies files that should not be included in the source-code distribution.
[tool.hatch.build.targets.sdist]
exclude = [".github", "recipe"]

# Specifies the library structure.
[tool.hatch.build.targets.wheel]
packages = ["src/cindra"]

# Ruff Configuration.
[tool.ruff]
line-length = 120         # Deviates from the commonly used '80' standard.
indent-width = 4
target-version = "py314"  # Targets the lowest supported version of python
src = ["src"]

# Excludes 'service' .py files, such as the sphinx configuration file, from linting.
extend-exclude = ["conf.py"]

# Checks for all potential violations and uses the exclusions below to target-disable specific ones.
lint.select = ["ALL"]

# General ignore directives
lint.ignore = [
    # Universal lint.ignore corpus. Present in every Ataraxis framework and Sollertia platform project.
    "W291",    # Conflicts with docstring formatting
    "ANN401",  # While suboptimal, ANY is a helpful type when used with caution
    "BLE001",  # Broad exception handling is necessary at library boundaries
    "C901",    # Sometimes complex functions are necessary
    "PLR0911", # Sometimes complex return graphs are necessary
    "PLR0912", # Sometimes complex functions are necessary
    "PLR0913", # Sometimes complex functions are necessary
    "PLR0915", # Sometimes functions with many statements are necessary
    "PLR0917", # PLR0913 already covers argument counts, and call sites pass keyword arguments
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "D107",    # __init__ is documented inside the main class docstring where applicable
    "D205",    # Bugs out for file descriptions
    "PLW0603", # While global statement usage is not ideal, it streamlines certain development patterns
    "TID252",  # Conflicts with the library import management strategy, which requires parent-relative imports
    "CPY001",  # The license is declared in the LICENSE file and the license and license-files metadata fields

    # Project-specific
    "FBT001",  # Qt toggle slots and mouse handlers receive their boolean state as a positional argument
    "FBT003",  # Qt and PyQtGraph setters take their boolean state as a positional argument
    "SLF001",  # Alternative constructors and the memory map teardown read private attributes of another object
]

# Additional formatting configurations
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false  # Like black, honors magic trailing commas
line-ending = "auto"               # Automatically detects and standardizes line-ending character

# Docstrings and comments' line length
[tool.ruff.lint.pycodestyle]
max-doc-length = 120  # Maximum documentation line length, the same as code

# Docstrings style
[tool.ruff.lint.pydocstyle]
convention = "google"

# Additional, file-specific 'ignore' directives
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"tests/**/*.py" = [
    # Shared test corpus. These entries are present in every Ataraxis framework and Sollertia platform project.
    "S101",    # Tests assert by design
    "PLR2004", # Expected values are clearer inline than as named constants
    "INP001",  # The test directory is not an importable package
    "SLF001",  # Tests exercise private module members directly
    "PT006",   # Parametrize argument names are declared as a single comma-separated string
    "ARG001",  # Pytest injects fixtures that individual tests may not reference
    "T201",    # Diagnostic prints are how a test reports intermediate state
    "D",       # Test names and inline comments carry the intent that docstrings carry in library code
    "ANN",     # Test functions and mock helpers do not need annotations

    # Project-specific
    "ARG002",  # Pytest injects fixtures that individual test methods may not reference
    "ARG005",  # Monkeypatch lambdas mirror the signatures of the callables they replace
    "EM101",   # Mock failure messages are clearer inline than as named variables
    "TRY003",  # Mock failure messages are defined at the raise site by design
]

# Import sorting (isort) configuration.
[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true          # Combines multiple "as" imports for the same package
force-wrap-aliases = true          # Wraps "as" imports so that each uses a separate line
force-sort-within-sections = true  # Forces "as" and "from" imports for the same package to be close
length-sort = true                 # Places shorter imports first

# MyPy configuration section.
[tool.mypy]
disallow_untyped_defs = true # Enforces function annotation
warn_unused_ignores = true   # Warns against using 'type: ignore' for packages with type stubs

exclude = [
    "cindra-\\d+",  # The temporary folder created when building the sdist
    "venv.*/",
    "build/",
    "dist/",
    "docs/",
    "stubs/",       # stubgen output target
    "recipe/",      # grayskull output target
    "tests/",
]

# Numba ships a py.typed marker, but its bundled annotations do not model prange as an iterable or expose runtime
# config attributes such as THREADING_LAYER. Treats the package as untyped so the JIT-compiled modules type-check
# against their actual runtime behavior rather than the incomplete bundled annotations.
[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
follow_imports = "skip"        # Treats all symbols imported from numba as untyped (Any)
ignore_missing_imports = true  # Suppresses missing-stub errors for the skipped package

# Pytest configuration. The import mode is declared here so that a bare 'pytest' invocation resolves test modules the
# same way the '{py314}-test' tox task does.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

# Silences SciPy's catastrophic-cancellation precision-loss warning, which fires when skewness is computed for the
# near-constant fluorescence traces generated by the extraction test fixtures. The flatness is intentional in the
# fixtures and does not indicate a defect in extract.py (_update_roi_extraction_statistics).
filterwarnings = [
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning",
]

# Configures branch coverage and lists the source files excluded from coverage measurement in full.
[tool.coverage.run]

# Measures branch coverage in addition to statement coverage, so that partial branches (one side of a conditional or
# loop that no test exercises) are reported as gaps rather than hidden behind full line coverage.
branch = true

# The GUI modules need a PySide6 and PyQtGraph runtime to execute, and the interface modules (the two CLIs, the MCP
# servers, and the MCP tool modules) wrap library functions the suite already covers. Each pattern opens with a wildcard
# so that it matches both the src tree and the site-packages copy the test environment measures.
omit = [
    "*/cindra/gui/*",
    "*/cindra/interface/*",
]

# Used by the 'coverage' tox task to merge the coverage data files the '{py314}-test' task produces.
[tool.coverage.paths]

# Maps coverage measured in site-packages to source files in src. The second pattern matches the POSIX virtual
# environment layout and the third matches the Windows layout, which omits the 'python*' path component. Both are
# required for the 'coverage' task to merge the data measured on either host into a single record per source file.
source = [
    "src/",
    ".tox/*/lib/python*/site-packages/",
    ".tox/*/Lib/site-packages/",
]

# Same as above, specifies the output directory for the coverage .html report
[tool.coverage.html]
directory = "reports/coverage_html"

# Specifies the coverage gate and additional ignore directives. The GUI and interface modules are omitted from
# measurement above. The lines carrying a 'pragma: no cover' comment, such as the Numba JIT bodies and the defensive
# branches guarding degenerate geometry, do not count against the gate.
[tool.coverage.report]
fail_under = 100     # Requires the test suite to cover every measured statement
show_missing = true  # Lists the statements missed by the test suite, so a failed check names the lines to cover
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __del__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]
